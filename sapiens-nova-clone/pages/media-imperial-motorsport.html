<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Private participant gallery for the Imperial Motorsport Engineering Programme.">
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/favicon.ico">
  <meta name="robots" content="noindex, nofollow">
  <title>Imperial Motorsport Engineering Programme Gallery - Sapiens Nova Academy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased">

  <main class="gallery-locked">
    <div class="container-large">
      <a href="media.html" class="back" data-i18n="gal.back">&larr; All galleries</a>
      <div class="mt-8 flex flex-col justify-between gap-6 md:flex-row md:items-end">
        <div>
          <p class="eyebrow" data-i18n="gal.lock.eyebrow">Private participant gallery</p>
          <h1 class="mt-3 font-serif text-4xl md:text-6xl" data-i18n="gal.lock.imperial">Imperial Motorsport Engineering Programme</h1>
        </div>
      </div>
      <div class="lock-box">
        <h2 data-i18n="gal.lock.title">Enter participant password</h2>
        <p class="hint" data-i18n="gal.lock.hint">Use the password supplied by Sapiens Nova Academy.</p>
        <form id="gallery-login" data-success-url="gallery.html">
          <input id="gallery-password" type="password" required autocomplete="current-password" placeholder="Gallery password" data-i18n-attr="placeholder:gal.lock.ph">
          <p id="login-error" class="err"></p>
          <button type="submit" class="submit" data-i18n="gal.lock.submit">Unlock gallery</button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
